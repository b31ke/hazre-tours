---
Name: myproject
---
SilverStripe\Core\Manifest\ModuleManifest:
  project: app

SilverStripe\SiteConfig\SiteConfig:
  extensions:
    - HazreTours\Admin\HazreSettings

# Pošiljalac mailova (adresa mora postojati na serveru)
SilverStripe\Control\Email\Email:
  admin_email:
    noreply@hazretours.ba: 'Hazre Tours'

# Bez demo stranica (Home, About Us, Contact Us) pri dev/build; stranice pravi tasks:hazre-import
SilverStripe\CMS\Model\SiteTree:
  create_default_pages: false

# Stranice greške (404, 500) nikad ne dodaju tehničku poruku na engleskom ("Error detail: …"), ni u razvojnom načinu
SilverStripe\ErrorPage\ErrorPage:
  dev_append_error_message: false
